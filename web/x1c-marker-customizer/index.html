<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X1C Marker Customizer</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f1218;
      color: #e8edf7;
      overflow-x: hidden;
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px;
      display: grid;
      gap: 12px;
      grid-template-columns: 340px 1fr;
    }
    .panel {
      background: #171c26;
      border: 1px solid #2a3242;
      border-radius: 12px;
      padding: 12px;
      max-height: calc(100vh - 28px);
      overflow: auto;
    }
    h1 { margin: 0 0 4px; font-size: 1.2rem; }
    .muted { color: #9fadca; font-size: .9rem; margin-bottom: 10px; }
    .row { margin-bottom: 10px; }
    .row label {
      display: flex;
      justify-content: space-between;
      font-size: .9rem;
      margin-bottom: 6px;
      color: #c9d5ef;
      gap: 8px;
    }
    input[type="range"], select, input[type="text"], input[type="color"] {
      width: 100%;
    }
    input[type="text"], select {
      background: #121723;
      color: #e8edf7;
      border: 1px solid #2a3242;
      border-radius: 8px;
      padding: 8px;
    }
    input[type="color"] {
      height: 38px;
      border: 1px solid #2a3242;
      border-radius: 8px;
      background: #121723;
      padding: 4px;
    }
    .btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      border: 1px solid #3a4761;
      background: #233148;
      color: #eef3ff;
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2c3e5e; }
    .full { grid-column: 1 / -1; }
    #view {
      width: 100%;
      min-height: 68vh;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a3242;
      background: radial-gradient(circle at 30% 20%, #202838, #0d1016);
    }
    .preset-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    @media (max-width: 900px) {
      .wrap { grid-template-columns: 1fr; }
      #view { min-height: 52vh; }
      .panel { max-height: none; }
    }
    code { background: #121723; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>X1C Marker Customizer</h1>
      <div class="muted">Single marker mode. Choose any listed Font Awesome icon, preview live, download STL.</div>
      <div class="muted" style="margin-top:-4px"><a href="../../index.html" style="color:#9fc0ff">← Back to project index</a></div>

      <div class="preset-row">
        <button id="presetDone" type="button">Preset: DONE</button>
        <button id="presetProgress" type="button">Preset: PROGRESS</button>
      </div>

      <div class="row">
        <label>Find icon</label>
        <input id="iconSearch" type="text" placeholder="Search icon name (check, rotate, wrench...)" />
      </div>

      <div class="row">
        <label>Font Awesome icon <span id="iconLabel_v"></span></label>
        <select id="iconSelect"></select>
      </div>

      <div class="row">
        <label>Icon color</label>
        <input id="iconColor" type="color" value="#22a85a" />
      </div>

      <div class="row">
        <label>Diameter (mm) <span id="diameter_v"></span></label>
        <input id="diameter" type="range" min="12" max="17.8" step="0.1" value="16.5" />
      </div>

      <div class="row">
        <label>Thickness (mm) <span id="height_v"></span></label>
        <input id="height" type="range" min="1.8" max="3.5" step="0.1" value="2.4" />
      </div>

      <div class="row">
        <label>Icon height (mm) <span id="iconH_v"></span></label>
        <input id="iconH" type="range" min="0.4" max="1.2" step="0.05" value="0.8" />
      </div>

      <div class="row">
        <label>Icon span (% of token) <span id="iconSpan_v"></span></label>
        <input id="iconSpan" type="range" min="0.30" max="0.62" step="0.01" value="0.50" />
      </div>

      <div class="row">
        <label>Magnet pocket diameter (mm) <span id="magnetD_v"></span></label>
        <input id="magnetD" type="range" min="5.8" max="6.5" step="0.05" value="6.2" />
      </div>

      <div class="row">
        <label>Magnet pocket depth (mm) <span id="pocketDepth_v"></span></label>
        <input id="pocketDepth" type="range" min="0.8" max="2.3" step="0.05" value="2.1" />
      </div>

      <div class="row">
        <label>Include magnet pocket</label>
        <input id="usePocket" type="checkbox" checked />
      </div>

      <div class="btns">
        <button id="dlMarker" class="full">Download Marker STL</button>
        <button id="reset" class="full">Reset defaults</button>
      </div>

      <p class="muted" style="margin-top:10px">Guardrails: icon auto-fit keeps it inside token bounds and icon is slightly embedded into top surface for printable union.</p>
    </div>

    <div id="view"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLExporter } from 'three/addons/exporters/STLExporter.js';
    import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
    import { icon as faIcon } from 'https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-svg-core@6.5.2/+esm';

    import {
      faCheck,
      faArrowsRotate,
      faClock,
      faTriangleExclamation,
      faWrench,
      faBolt,
      faHouse,
      faTruck,
      faBox,
      faFlask,
      faPrint,
      faScrewdriverWrench,
      faCircleInfo,
      faThumbsUp,
      faBug,
      faGear,
      faCalendarCheck,
      faCirclePlay,
      faSeedling,
      faFire,
      faXmark,
      faBan,
      faRecycle,
      faShield,
      faAnchor
    } from 'https://cdn.jsdelivr.net/npm/@fortawesome/free-solid-svg-icons@6.5.2/+esm';

    import {
      faCircleCheck,
      faCircleXmark,
      faCircleQuestion
    } from 'https://cdn.jsdelivr.net/npm/@fortawesome/free-regular-svg-icons@6.5.2/+esm';

    const ICONS = [
      { key: 'circle-check-regular', label: 'Circle Check (Regular)', def: faCircleCheck },
      { key: 'check-solid', label: 'Check (Solid)', def: faCheck },
      { key: 'arrows-rotate', label: 'Arrows Rotate', def: faArrowsRotate },
      { key: 'clock-solid', label: 'Clock', def: faClock },
      { key: 'calendar-check', label: 'Calendar Check', def: faCalendarCheck },
      { key: 'circle-play', label: 'Circle Play', def: faCirclePlay },
      { key: 'triangle-exclamation', label: 'Triangle Exclamation', def: faTriangleExclamation },
      { key: 'wrench', label: 'Wrench', def: faWrench },
      { key: 'screwdriver-wrench', label: 'Screwdriver Wrench', def: faScrewdriverWrench },
      { key: 'gear', label: 'Gear', def: faGear },
      { key: 'bolt', label: 'Bolt', def: faBolt },
      { key: 'print', label: 'Print', def: faPrint },
      { key: 'flask', label: 'Flask', def: faFlask },
      { key: 'bug', label: 'Bug', def: faBug },
      { key: 'truck', label: 'Truck', def: faTruck },
      { key: 'box', label: 'Box', def: faBox },
      { key: 'house', label: 'House', def: faHouse },
      { key: 'seedling', label: 'Seedling', def: faSeedling },
      { key: 'fire', label: 'Fire', def: faFire },
      { key: 'recycle', label: 'Recycle', def: faRecycle },
      { key: 'shield', label: 'Shield', def: faShield },
      { key: 'anchor', label: 'Anchor', def: faAnchor },
      { key: 'circle-info', label: 'Circle Info', def: faCircleInfo },
      { key: 'thumbs-up', label: 'Thumbs Up', def: faThumbsUp },
      { key: 'circle-question', label: 'Circle Question (Regular)', def: faCircleQuestion },
      { key: 'xmark', label: 'X Mark', def: faXmark },
      { key: 'ban', label: 'Ban', def: faBan },
      { key: 'circle-xmark-regular', label: 'Circle X Mark (Regular)', def: faCircleXmark },
    ];

    const iconByKey = new Map(ICONS.map((i) => [i.key, i]));
    const shapeCache = new Map();
    let selectedIconKey = 'circle-check-regular';

    const el = (id) => document.getElementById(id);
    const inputs = {
      iconSearch: el('iconSearch'),
      iconSelect: el('iconSelect'),
      iconColor: el('iconColor'),
      diameter: el('diameter'),
      height: el('height'),
      iconH: el('iconH'),
      iconSpan: el('iconSpan'),
      magnetD: el('magnetD'),
      pocketDepth: el('pocketDepth'),
      usePocket: el('usePocket')
    };
    const labels = {
      iconLabel: el('iconLabel_v'),
      diameter: el('diameter_v'),
      height: el('height_v'),
      iconH: el('iconH_v'),
      iconSpan: el('iconSpan_v'),
      magnetD: el('magnetD_v'),
      pocketDepth: el('pocketDepth_v')
    };

    function populateIconSelect(searchTerm = '') {
      const q = searchTerm.trim().toLowerCase();
      const filtered = ICONS.filter((icon) => !q || icon.label.toLowerCase().includes(q) || icon.key.includes(q));
      inputs.iconSelect.innerHTML = '';

      if (!filtered.length) {
        const current = iconByKey.get(selectedIconKey);
        const opt = document.createElement('option');
        opt.value = selectedIconKey;
        opt.textContent = `No match — keeping ${current ? current.label : selectedIconKey}`;
        inputs.iconSelect.appendChild(opt);
        inputs.iconSelect.value = selectedIconKey;
        return;
      }

      for (const icon of filtered) {
        const opt = document.createElement('option');
        opt.value = icon.key;
        opt.textContent = icon.label;
        inputs.iconSelect.appendChild(opt);
      }

      if (filtered.some((i) => i.key === selectedIconKey)) {
        inputs.iconSelect.value = selectedIconKey;
      } else {
        selectedIconKey = filtered[0].key;
        inputs.iconSelect.value = selectedIconKey;
      }
    }

    populateIconSelect('');
    inputs.iconSelect.value = selectedIconKey;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 1000);
    camera.position.set(0, 28, 36);

    const view = el('view');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
    view.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.8, 0);
    controls.minDistance = 12;
    controls.maxDistance = 80;

    scene.add(new THREE.AmbientLight(0xffffff, 0.84));
    const key = new THREE.DirectionalLight(0xffffff, 1.1);
    key.position.set(13, 20, 14);
    scene.add(key);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(80, 128),
      new THREE.MeshStandardMaterial({ color: 0x11151f, roughness: 0.95, metalness: 0.02 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    scene.add(ground);

    const tokenMat = new THREE.MeshStandardMaterial({ color: 0xe3e7ef, roughness: 0.42, metalness: 0.06 });
    const iconMat = new THREE.MeshStandardMaterial({ color: 0x22a85a, roughness: 0.28, metalness: 0.05 });
    let markerGroup = new THREE.Group();
    scene.add(markerGroup);

    function ringGeometry(outerR, innerR, depth) {
      const shape = new THREE.Shape();
      shape.absarc(0, 0, outerR, 0, Math.PI * 2, false);
      const hole = new THREE.Path();
      hole.absarc(0, 0, innerR, 0, Math.PI * 2, true);
      shape.holes.push(hole);
      const g = new THREE.ExtrudeGeometry(shape, { depth, steps: 1, bevelEnabled: false, curveSegments: 144 });
      g.rotateX(Math.PI / 2);
      g.translate(0, depth, 0);
      return g;
    }

    function getParams() {
      const p = {
        iconKey: selectedIconKey,
        iconColor: inputs.iconColor.value,
        d: parseFloat(inputs.diameter.value),
        h: parseFloat(inputs.height.value),
        iconH: parseFloat(inputs.iconH.value),
        iconSpan: parseFloat(inputs.iconSpan.value),
        magnetD: parseFloat(inputs.magnetD.value),
        pocketDepth: parseFloat(inputs.pocketDepth.value),
        usePocket: inputs.usePocket.checked,
      };
      p.pocketDepth = Math.min(p.pocketDepth, Math.max(0.2, p.h - 0.3));
      p.iconSpanMm = Math.min(p.d * p.iconSpan, p.d * 0.68); // guardrail: keep icon safely inside token
      return p;
    }

    function clearGroup(g) {
      while (g.children.length) {
        const c = g.children.pop();
        c.geometry?.dispose?.();
      }
    }

    function buildBase(p) {
      const g = new THREE.Group();
      const r = p.d / 2;
      if (!p.usePocket) {
        const full = new THREE.Mesh(new THREE.CylinderGeometry(r, r, p.h, 160), tokenMat);
        full.position.y = p.h / 2;
        g.add(full);
        return g;
      }

      const pd = p.pocketDepth;
      const topH = p.h - pd;
      if (topH > 0.05) {
        const top = new THREE.Mesh(new THREE.CylinderGeometry(r, r, topH, 160), tokenMat);
        top.position.y = pd + topH / 2;
        g.add(top);
      }
      const ring = new THREE.Mesh(ringGeometry(r, p.magnetD / 2, pd), tokenMat);
      g.add(ring);
      return g;
    }

    const svgLoader = new SVGLoader();

    function fontAwesomeShapes(iconDef) {
      const svg = faIcon(iconDef, { styles: { color: '#fff' } }).html.join('');
      const parsed = svgLoader.parse(svg);
      const out = [];
      for (const p of parsed.paths) out.push(...SVGLoader.createShapes(p));
      return out;
    }

    function getShapes(iconKey) {
      if (shapeCache.has(iconKey)) return shapeCache.get(iconKey);
      const icon = iconByKey.get(iconKey);
      if (!icon) return [];
      const shapes = fontAwesomeShapes(icon.def);
      shapeCache.set(iconKey, shapes);
      return shapes;
    }

    function extrudeShapes(shapes, height, targetSpan = 10.8) {
      const g = new THREE.ExtrudeGeometry(shapes, {
        depth: height,
        steps: 1,
        bevelEnabled: false,
        curveSegments: 96,
      });

      // FontAwesome is Y-up 2D. Convert to token top surface.
      g.rotateX(-Math.PI / 2);
      g.computeBoundingBox();
      const b1 = g.boundingBox;
      const spanX = b1.max.x - b1.min.x;
      const spanZ = b1.max.z - b1.min.z;
      const span = Math.max(spanX, spanZ) || 1;
      const s = targetSpan / span;
      g.scale(s, 1, s);

      g.computeBoundingBox();
      const b2 = g.boundingBox;
      const cx = (b2.min.x + b2.max.x) / 2;
      const cz = (b2.min.z + b2.max.z) / 2;
      g.translate(-cx, 0, -cz);

      return g;
    }

    function rebuild() {
      const p = getParams();
      labels.diameter.textContent = p.d.toFixed(2);
      labels.height.textContent = p.h.toFixed(2);
      labels.iconH.textContent = p.iconH.toFixed(2);
      labels.iconSpan.textContent = `${Math.round(p.iconSpan * 100)}%`;
      labels.magnetD.textContent = p.magnetD.toFixed(2);
      labels.pocketDepth.textContent = p.pocketDepth.toFixed(2);
      const currentIcon = iconByKey.get(p.iconKey);
      labels.iconLabel.textContent = currentIcon ? currentIcon.label : '';

      clearGroup(markerGroup);

      const base = buildBase(p);
      markerGroup.add(...base.children);

      const shapes = getShapes(p.iconKey);
      if (shapes.length) {
        const iconGeo = extrudeShapes(shapes, p.iconH, p.iconSpanMm);
        iconMat.color.set(p.iconColor);
        const mark = new THREE.Mesh(iconGeo, iconMat);
        mark.position.y = p.h - Math.min(0.08, p.iconH * 0.2); // slight overlap to guarantee printable union
        markerGroup.add(mark);
      }

      markerGroup.position.set(0, 0, 0);
    }

    function resize() {
      const w = view.clientWidth;
      const h = view.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    const exporter = new STLExporter();
    function download(name, object3d) {
      const stl = exporter.parse(object3d, { binary: false });
      const blob = new Blob([stl], { type: 'model/stl' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      return stl;
    }

    function applyPreset(iconKey, color, span) {
      inputs.iconSearch.value = '';
      populateIconSelect('');
      if (iconByKey.has(iconKey)) {
        selectedIconKey = iconKey;
        inputs.iconSelect.value = selectedIconKey;
      }
      inputs.iconColor.value = color;
      inputs.iconSpan.value = span;
      rebuild();
    }

    el('dlMarker').addEventListener('click', () => {
      const p = getParams();
      const iconSlug = (p.iconKey || 'icon').replace(/[^a-z0-9-]+/gi, '-').toLowerCase();
      download(`x1c-marker-${iconSlug}-d${p.d.toFixed(1)}-h${p.h.toFixed(1)}.stl`, markerGroup);
    });

    el('presetDone').addEventListener('click', () => applyPreset('circle-check-regular', '#22a85a', '0.50'));

    el('presetProgress').addEventListener('click', () => applyPreset('arrows-rotate', '#cb4056', '0.46'));

    el('reset').addEventListener('click', () => {
      inputs.iconSearch.value = '';
      selectedIconKey = 'circle-check-regular';
      populateIconSelect('');
      inputs.iconSelect.value = selectedIconKey;
      inputs.iconColor.value = '#22a85a';
      inputs.diameter.value = '16.5';
      inputs.height.value = '2.4';
      inputs.iconH.value = '0.8';
      inputs.iconSpan.value = '0.50';
      inputs.magnetD.value = '6.2';
      inputs.pocketDepth.value = '2.1';
      inputs.usePocket.checked = true;
      rebuild();
    });

    inputs.iconSelect.addEventListener('change', () => {
      if (iconByKey.has(inputs.iconSelect.value)) {
        selectedIconKey = inputs.iconSelect.value;
      }
      rebuild();
    });

    inputs.iconSearch.addEventListener('input', () => {
      populateIconSelect(inputs.iconSearch.value);
      rebuild();
    });

    Object.values(inputs).forEach((node) => {
      if (node === inputs.iconSearch || node === inputs.iconSelect) return;
      node.addEventListener('input', rebuild);
      node.addEventListener('change', rebuild);
    });

    window.addEventListener('resize', resize);

    // test hook for automated verification
    window.__testState = () => {
      const p = getParams();
      const baseParts = p.usePocket ? 2 : 1;
      return {
        iconKey: p.iconKey,
        childCount: markerGroup.children.length,
        hasIcon: markerGroup.children.length > baseParts
      };
    };

    rebuild();
    resize();
    animate();
    window.__appReady = true;
  </script>
</body>
</html>
