<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ceiling Socket Cover Viewer</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #0f1218; color: #e8edf7; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 14px; display: grid; gap: 12px; grid-template-columns: 340px 1fr; }
    .panel { background: #171c26; border: 1px solid #2a3242; border-radius: 12px; padding: 12px; }
    .row { margin-bottom: 10px; }
    .row label { display:flex; justify-content: space-between; gap:8px; margin-bottom:6px; color:#c9d5ef; font-size:.9rem; }
    input[type="range"], select { width: 100%; }
    .btns { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px; }
    button { border:1px solid #3a4761; background:#233148; color:#eef3ff; padding:10px; border-radius:10px; font-weight:600; cursor:pointer; }
    button:hover { background:#2c3e5e; }
    #view { width:100%; height:clamp(320px, 58svh, 760px); border-radius:12px; overflow:hidden; border:1px solid #2a3242; background:radial-gradient(circle at 30% 20%, #202838, #0d1016); }
    #view canvas { display:block; width:100% !important; height:100% !important; }
    .muted { color:#9fadca; font-size:.9rem; margin-bottom:10px; }
    .full { grid-column: 1 / -1; }
    @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } #view { height:clamp(280px, 50svh, 520px); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1 style="margin:0 0 4px; font-size:1.2rem;">Ceiling Socket Cover Viewer</h1>
      <div class="muted">Live 3D preview for simple, cosmic monster, and kraken abyss styles with mounting options (press-fit or screw tabs).</div>
      <div class="muted" style="margin-top:-4px"><a href="../../index.html" style="color:#9fc0ff">← Back to project index</a></div>

      <div class="row">
        <label>Style <span id="style_v"></span></label>
        <select id="style">
          <option value="simple">Simple</option>
          <option value="fun">Fun (cosmic monster)</option>
          <option value="kraken">Kraken (abyss)</option>
        </select>
      </div>

      <div class="row">
        <label>Hole diameter (mm) <span id="hole_v"></span></label>
        <input id="hole" type="range" min="45" max="110" step="1" value="68" />
      </div>

      <div class="row">
        <label>Clearance (mm) <span id="clearance_v"></span></label>
        <input id="clearance" type="range" min="1" max="8" step="0.5" value="2" />
      </div>

      <div class="row">
        <label>Thickness (mm) <span id="thick_v"></span></label>
        <input id="thick" type="range" min="1.6" max="4.2" step="0.1" value="2.4" />
      </div>

      <div class="row">
        <label>Mounting mode</label>
        <select id="mountMode">
          <option value="press_fit" selected>Press-fit tabs</option>
          <option value="screw_tabs">Screw tabs</option>
          <option value="locator_ring">Locator ring only</option>
          <option value="none">None (visual only)</option>
        </select>
      </div>

      <div class="row">
        <label>Center hole</label>
        <select id="centerHole">
          <option value="off" selected>Off (full cover)</option>
          <option value="on">On (pass-through)</option>
        </select>
      </div>

      <div class="row">
        <label>Wire hole diameter (mm) <span id="wire_v"></span></label>
        <input id="wire" type="range" min="6" max="26" step="1" value="12" />
      </div>

      <div class="btns">
        <button id="presetSimple">Preset: Simple</button>
        <button id="presetFun">Preset: Cosmic</button>
        <button id="presetKraken">Preset: Kraken</button>
        <button id="downloadStl">Download STL</button>
        <button id="reset" class="full">Reset defaults</button>
      </div>
    </div>
    <div id="view"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLExporter } from 'three/addons/exporters/STLExporter.js';

    const el = (id) => document.getElementById(id);
    const inputs = {
      style: el('style'),
      hole: el('hole'),
      clearance: el('clearance'),
      thick: el('thick'),
      mountMode: el('mountMode'),
      centerHole: el('centerHole'),
      wire: el('wire')
    };
    const labels = {
      style: el('style_v'),
      hole: el('hole_v'),
      clearance: el('clearance_v'),
      thick: el('thick_v'),
      wire: el('wire_v')
    };

    const view = el('view');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 1200);
    camera.position.set(0, 52, 78);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
    view.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1, 0);
    controls.minDistance = 18;
    controls.maxDistance = 200;

    scene.add(new THREE.AmbientLight(0xffffff, 0.82));
    const key = new THREE.DirectionalLight(0xffffff, 1.08);
    key.position.set(24, 32, 20);
    scene.add(key);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(240, 128),
      new THREE.MeshStandardMaterial({ color: 0x11151f, roughness: 0.95, metalness: 0.02 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    scene.add(ground);

    const coverMat = new THREE.MeshStandardMaterial({ color: 0xe3e7ef, roughness: 0.45, metalness: 0.05 });
    const accentMat = new THREE.MeshStandardMaterial({ color: 0xffce47, roughness: 0.35, metalness: 0.06 });

    let coverGroup = new THREE.Group();
    scene.add(coverGroup);

    function getParams() {
      return {
        style: inputs.style.value,
        hole: parseFloat(inputs.hole.value),
        clearance: parseFloat(inputs.clearance.value),
        thickness: parseFloat(inputs.thick.value),
        mountMode: inputs.mountMode.value,
        centerHole: inputs.centerHole.value === 'on',
        wire: parseFloat(inputs.wire.value)
      };
    }

    function clearGroup(g) {
      while (g.children.length) {
        const c = g.children.pop();
        c.geometry?.dispose?.();
      }
    }

    function makeCoverShape(outerR, centerHole, centerR) {
      const shape = new THREE.Shape();
      shape.absarc(0, 0, outerR, 0, Math.PI * 2, false);
      if (centerHole) {
        const h = new THREE.Path();
        h.absarc(0, 0, centerR, 0, Math.PI * 2, true);
        shape.holes.push(h);
      }
      return shape;
    }

    function buildBase(p) {
      const group = new THREE.Group();
      const coverD = p.hole + 2 * p.clearance;
      const outerR = coverD / 2;

      const shape = makeCoverShape(outerR, p.centerHole, p.wire / 2);
      const plateGeo = new THREE.ExtrudeGeometry(shape, { depth: p.thickness, steps: 1, bevelEnabled: false, curveSegments: 128 });
      plateGeo.rotateX(-Math.PI / 2);
      // keep cover seated on ground plane (top at ~thickness)
      plateGeo.translate(0, 0, 0);
      group.add(new THREE.Mesh(plateGeo, coverMat));

      // mounting features
      const locatorD = p.hole - 0.6;
      const locatorDepth = 2.0;
      const locatorWall = 1.2;

      const addLocatorRing = () => {
        const ringShape = new THREE.Shape();
        ringShape.absarc(0, 0, locatorD / 2, 0, Math.PI * 2, false);
        const ringHole = new THREE.Path();
        ringHole.absarc(0, 0, Math.max(0.1, (locatorD - 2 * locatorWall) / 2), 0, Math.PI * 2, true);
        ringShape.holes.push(ringHole);
        const ringGeo = new THREE.ExtrudeGeometry(ringShape, { depth: locatorDepth, steps: 1, bevelEnabled: false, curveSegments: 96 });
        ringGeo.rotateX(-Math.PI / 2);
        ringGeo.translate(0, -locatorDepth, 0);
        group.add(new THREE.Mesh(ringGeo, coverMat));
      };

      if (p.mountMode === 'press_fit' || p.mountMode === 'locator_ring') {
        addLocatorRing();
      }

      if (p.mountMode === 'press_fit') {
        const tabCount = 4;
        const tabDepth = 1.4;
        const tabWidth = 8;
        const tabHeight = 1.8;
        const tabR = locatorD / 2 + tabDepth * 0.55;
        for (let i = 0; i < tabCount; i += 1) {
          const a = (i / tabCount) * Math.PI * 2;
          const tabGeo = new THREE.BoxGeometry(tabDepth, tabHeight, tabWidth);
          const tab = new THREE.Mesh(tabGeo, accentMat);
          tab.position.set(Math.cos(a) * tabR, -tabHeight / 2, Math.sin(a) * tabR);
          tab.rotation.y = -a;
          group.add(tab);
        }
      }

      if (p.mountMode === 'screw_tabs') {
        const tabSpan = coverD + 18;
        const tabD = 12;
        const holeD = 4.2;
        const tabT = 2.6;
        const coverR = coverD / 2;
        for (const sx of [-1, 1]) {
          const x = sx * tabSpan / 2;

          const earShape = new THREE.Shape();
          earShape.absarc(0, 0, tabD / 2, 0, Math.PI * 2, false);
          const earHole = new THREE.Path();
          earHole.absarc(0, 0, holeD / 2, 0, Math.PI * 2, true);
          earShape.holes.push(earHole);
          const earGeo = new THREE.ExtrudeGeometry(earShape, { depth: tabT, steps: 1, bevelEnabled: false, curveSegments: 72 });
          earGeo.rotateX(-Math.PI / 2);
          earGeo.translate(x, 0, 0);
          group.add(new THREE.Mesh(earGeo, coverMat));

          const bridgeLen = Math.max(2, Math.abs(x - sx * (coverR - 1.0)));
          const bridge = new THREE.Mesh(new THREE.BoxGeometry(bridgeLen, tabT, 6.2), coverMat);
          bridge.position.set(sx * (coverR - 1.0 + bridgeLen / 2), tabT / 2, 0);
          group.add(bridge);
        }
      }

      return { group, coverD };
    }

    function addFunCosmicMonster(group, p, coverD) {
      const z = p.thickness - 0.02;
      const faceD = coverD * 0.66;
      const ringOuter = faceD * 0.48;
      const ringInner = faceD * 0.39;
      const ringH = 0.9;

      // cleaner portal ring
      const ringShape = new THREE.Shape();
      ringShape.absarc(0, 0, ringOuter, 0, Math.PI * 2, false);
      const ringHole = new THREE.Path();
      ringHole.absarc(0, 0, ringInner, 0, Math.PI * 2, true);
      ringShape.holes.push(ringHole);
      const ringGeo = new THREE.ExtrudeGeometry(ringShape, { depth: ringH, steps: 1, bevelEnabled: false, curveSegments: 120 });
      ringGeo.rotateX(-Math.PI / 2);
      ringGeo.translate(0, ringH + z, 0);
      group.add(new THREE.Mesh(ringGeo, accentMat));

      // soft rays
      for (let a = 0; a < 360; a += 45) {
        const rayA = new THREE.Mesh(new THREE.CylinderGeometry(faceD * 0.0425, faceD * 0.0425, ringH, 36), accentMat);
        const rayB = new THREE.Mesh(new THREE.CylinderGeometry(faceD * 0.0175, faceD * 0.0175, ringH, 24), accentMat);
        const rad = THREE.MathUtils.degToRad(a);
        rayA.position.set(Math.cos(rad) * ringOuter * 0.88, z + ringH / 2, Math.sin(rad) * ringOuter * 0.88);
        rayB.position.set(Math.cos(rad) * ringOuter * 1.05, z + ringH / 2, Math.sin(rad) * ringOuter * 1.05);
        group.add(rayA, rayB);
      }

      // central eye stack
      const eye = new THREE.Mesh(new THREE.CylinderGeometry(faceD * 0.125, faceD * 0.125, ringH, 80), accentMat);
      eye.position.set(0, z + ringH / 2, faceD * 0.02);
      group.add(eye);
      const pupil = new THREE.Mesh(new THREE.CylinderGeometry(faceD * 0.055, faceD * 0.055, ringH * 0.88, 60), coverMat);
      pupil.position.set(0, z + ringH * 0.56, faceD * 0.02);
      group.add(pupil);

      // upper eye arc (crescent)
      const arcOuter = new THREE.Shape();
      arcOuter.absarc(0, 0, faceD * 0.17, 0, Math.PI * 2, false);
      const arcHole = new THREE.Path();
      arcHole.absarc(0, -faceD * 0.11, faceD * 0.15, 0, Math.PI * 2, true);
      arcOuter.holes.push(arcHole);
      const arcGeo = new THREE.ExtrudeGeometry(arcOuter, { depth: ringH * 0.78, steps: 1, bevelEnabled: false, curveSegments: 80 });
      arcGeo.rotateX(-Math.PI / 2);
      arcGeo.translate(0, z + ringH * 0.78, faceD * 0.10);
      group.add(new THREE.Mesh(arcGeo, accentMat));

      // mirrored cheek tendrils
      const tPts = [];
      for (let i = 0; i <= 7; i += 1) {
        tPts.push(new THREE.Vector3(
          faceD * (0.07 + i * 0.055),
          z + ringH * 0.52,
          -faceD * (0.10 + i * 0.016) + faceD * 0.028 * Math.sin(THREE.MathUtils.degToRad(i * 45))
        ));
      }
      const tubeR = faceD * 0.033;
      group.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(tPts), 72, tubeR, 18, false), accentMat));
      const tPtsL = tPts.map((v) => new THREE.Vector3(-v.x, v.y, v.z));
      group.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(tPtsL), 72, tubeR, 18, false), accentMat));
    }

    function addKrakenAbyss(group, p, coverD) {
      const z = p.thickness - 0.02;
      const faceD = coverD * 0.72;
      const ringH = 0.95;

      // crown ring
      const crown = new THREE.Shape();
      crown.absarc(0, 0, faceD * 0.46, 0, Math.PI * 2, false);
      const crownHole = new THREE.Path();
      crownHole.absarc(0, 0, faceD * 0.36, 0, Math.PI * 2, true);
      crown.holes.push(crownHole);
      const crownGeo = new THREE.ExtrudeGeometry(crown, { depth: ringH, steps: 1, bevelEnabled: false, curveSegments: 120 });
      crownGeo.rotateX(-Math.PI / 2);
      crownGeo.translate(0, ringH + z, 0);
      group.add(new THREE.Mesh(crownGeo, accentMat));

      // head
      const head = new THREE.Mesh(new THREE.CylinderGeometry(faceD * 0.14, faceD * 0.14, ringH, 80), accentMat);
      head.position.set(0, z + ringH / 2, faceD * 0.03);
      group.add(head);

      // eyes
      const eyeL = new THREE.Mesh(new THREE.CylinderGeometry(faceD * 0.05, faceD * 0.05, ringH, 60), accentMat);
      const eyeR = new THREE.Mesh(new THREE.CylinderGeometry(faceD * 0.05, faceD * 0.05, ringH, 60), accentMat);
      eyeL.position.set(-faceD * 0.10, z + ringH / 2, faceD * 0.11);
      eyeR.position.set(faceD * 0.10, z + ringH / 2, faceD * 0.11);
      group.add(eyeL, eyeR);
      const slitGeo = new THREE.BoxGeometry(faceD * 0.018, ringH * 0.8, faceD * 0.08);
      const slitL = new THREE.Mesh(slitGeo, coverMat);
      const slitR = new THREE.Mesh(slitGeo, coverMat);
      slitL.position.copy(eyeL.position);
      slitR.position.copy(eyeR.position);
      group.add(slitL, slitR);

      // six smooth tentacles
      for (const a of [-62, -38, -14, 14, 38, 62]) {
        const pts = [
          new THREE.Vector3(0, z + ringH * 0.50, -faceD * 0.02),
          new THREE.Vector3(faceD * 0.10 * Math.sin(THREE.MathUtils.degToRad(a)), z + ringH * 0.50, -faceD * (0.12 + 0.02 * Math.cos(THREE.MathUtils.degToRad(a)))),
          new THREE.Vector3(faceD * 0.21 * Math.sin(THREE.MathUtils.degToRad(a)), z + ringH * 0.50, -faceD * (0.20 + 0.03 * Math.cos(THREE.MathUtils.degToRad(a)))),
          new THREE.Vector3(faceD * 0.31 * Math.sin(THREE.MathUtils.degToRad(a)), z + ringH * 0.50, -faceD * (0.28 + 0.02 * Math.sin(THREE.MathUtils.degToRad(a))))
        ];
        group.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 72, faceD * 0.035, 18, false), accentMat));
      }

      // center maw ring
      const maw = new THREE.Shape();
      maw.absarc(0, 0, faceD * 0.09, 0, Math.PI * 2, false);
      const mawHole = new THREE.Path();
      mawHole.absarc(0, 0, faceD * 0.05, 0, Math.PI * 2, true);
      maw.holes.push(mawHole);
      const mawGeo = new THREE.ExtrudeGeometry(maw, { depth: ringH * 0.9, steps: 1, bevelEnabled: false, curveSegments: 64 });
      mawGeo.rotateX(-Math.PI / 2);
      mawGeo.translate(0, z + ringH * 0.9, -faceD * 0.04);
      group.add(new THREE.Mesh(mawGeo, accentMat));
    }

    function rebuild() {
      const p = getParams();
      labels.style.textContent = p.style;
      labels.hole.textContent = p.hole.toFixed(0);
      labels.clearance.textContent = p.clearance.toFixed(1);
      labels.thick.textContent = p.thickness.toFixed(1);
      labels.wire.textContent = p.wire.toFixed(0);

      clearGroup(coverGroup);
      const { group, coverD } = buildBase(p);
      coverGroup.add(...group.children);

      if (p.style === 'kraken') {
        accentMat.color.set(0x8f5bff);
        addKrakenAbyss(coverGroup, p, coverD);
      } else if (p.style === 'fun') {
        accentMat.color.set(0xffce47);
        addFunCosmicMonster(coverGroup, p, coverD);
      }
    }

    function resize() {
      const w = view.clientWidth;
      const h = view.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    function downloadCurrentStl() {
      const p = getParams();
      const exportGroup = new THREE.Group();
      const { group, coverD } = buildBase(p);
      exportGroup.add(...group.children);

      if (p.style === 'kraken') {
        addKrakenAbyss(exportGroup, p, coverD);
      } else if (p.style === 'fun') {
        addFunCosmicMonster(exportGroup, p, coverD);
      }

      const exporter = new STLExporter();
      const stlText = exporter.parse(exportGroup, { binary: false });
      const blob = new Blob([stlText], { type: 'model/stl' });
      const a = document.createElement('a');
      const safeMode = p.mountMode.replace(/[^a-z0-9_\-]/gi, '_');
      a.href = URL.createObjectURL(blob);
      a.download = `ceiling-cover-${p.style}-${safeMode}-${Math.round(p.hole)}mm.stl`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
    }

    function setSimplePreset() {
      inputs.style.value = 'simple';
      inputs.mountMode.value = 'press_fit';
      inputs.centerHole.value = 'off';
      inputs.hole.value = '68';
      inputs.clearance.value = '2';
      inputs.thick.value = '2.4';
      rebuild();
    }

    function setFunPreset() {
      inputs.style.value = 'fun';
      inputs.mountMode.value = 'press_fit';
      inputs.centerHole.value = 'off';
      inputs.hole.value = '68';
      inputs.clearance.value = '2.5';
      inputs.thick.value = '2.6';
      rebuild();
    }

    function setKrakenPreset() {
      inputs.style.value = 'kraken';
      inputs.mountMode.value = 'press_fit';
      inputs.centerHole.value = 'off';
      inputs.hole.value = '68';
      inputs.clearance.value = '3.0';
      inputs.thick.value = '2.8';
      rebuild();
    }

    el('presetSimple').addEventListener('click', setSimplePreset);
    el('presetFun').addEventListener('click', setFunPreset);
    el('presetKraken').addEventListener('click', setKrakenPreset);
    el('downloadStl').addEventListener('click', downloadCurrentStl);
    el('reset').addEventListener('click', () => {
      inputs.style.value = 'simple';
      inputs.hole.value = '68';
      inputs.clearance.value = '2';
      inputs.thick.value = '2.4';
      inputs.mountMode.value = 'press_fit';
      inputs.centerHole.value = 'off';
      inputs.wire.value = '12';
      rebuild();
    });

    Object.values(inputs).forEach((n) => {
      n.addEventListener('input', rebuild);
      n.addEventListener('change', rebuild);
    });
    window.addEventListener('resize', resize);

    rebuild();
    resize();
    animate();
    window.__appReady = true;
  </script>
</body>
</html>
