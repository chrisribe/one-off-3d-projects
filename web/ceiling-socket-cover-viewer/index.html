<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ceiling Socket Cover Viewer</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #0f1218; color: #e8edf7; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 14px; display: grid; gap: 12px; grid-template-columns: 340px 1fr; }
    .panel { background: #171c26; border: 1px solid #2a3242; border-radius: 12px; padding: 12px; }
    .row { margin-bottom: 10px; }
    .row label { display:flex; justify-content: space-between; gap:8px; margin-bottom:6px; color:#c9d5ef; font-size:.9rem; }
    input[type="range"], select { width: 100%; }
    .btns { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px; }
    button { border:1px solid #3a4761; background:#233148; color:#eef3ff; padding:10px; border-radius:10px; font-weight:600; cursor:pointer; }
    button:hover { background:#2c3e5e; }
    #view { width:100%; height:clamp(320px, 58svh, 760px); border-radius:12px; overflow:hidden; border:1px solid #2a3242; background:radial-gradient(circle at 30% 20%, #202838, #0d1016); }
    #view canvas { display:block; width:100% !important; height:100% !important; }
    .muted { color:#9fadca; font-size:.9rem; margin-bottom:10px; }
    .full { grid-column: 1 / -1; }
    @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } #view { height:clamp(280px, 50svh, 520px); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1 style="margin:0 0 4px; font-size:1.2rem;">Ceiling Socket Cover Viewer</h1>
      <div class="muted">Live 3D preview for simple, cosmic monster, and kraken abyss styles.</div>
      <div class="muted" style="margin-top:-4px"><a href="../../index.html" style="color:#9fc0ff">← Back to project index</a></div>

      <div class="row">
        <label>Style <span id="style_v"></span></label>
        <select id="style">
          <option value="simple">Simple</option>
          <option value="fun">Fun (cosmic monster)</option>
          <option value="kraken">Kraken (abyss)</option>
        </select>
      </div>

      <div class="row">
        <label>Hole diameter (mm) <span id="hole_v"></span></label>
        <input id="hole" type="range" min="45" max="110" step="1" value="68" />
      </div>

      <div class="row">
        <label>Clearance (mm) <span id="clearance_v"></span></label>
        <input id="clearance" type="range" min="1" max="8" step="0.5" value="2" />
      </div>

      <div class="row">
        <label>Thickness (mm) <span id="thick_v"></span></label>
        <input id="thick" type="range" min="1.6" max="4.2" step="0.1" value="2.4" />
      </div>

      <div class="row">
        <label>Center hole</label>
        <select id="centerHole">
          <option value="off" selected>Off (full cover)</option>
          <option value="on">On (pass-through)</option>
        </select>
      </div>

      <div class="row">
        <label>Wire hole diameter (mm) <span id="wire_v"></span></label>
        <input id="wire" type="range" min="6" max="26" step="1" value="12" />
      </div>

      <div class="btns">
        <button id="presetSimple">Preset: Simple</button>
        <button id="presetFun">Preset: Cosmic</button>
        <button id="presetKraken">Preset: Kraken</button>
        <button id="reset" class="full">Reset defaults</button>
      </div>
    </div>
    <div id="view"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const el = (id) => document.getElementById(id);
    const inputs = {
      style: el('style'),
      hole: el('hole'),
      clearance: el('clearance'),
      thick: el('thick'),
      centerHole: el('centerHole'),
      wire: el('wire')
    };
    const labels = {
      style: el('style_v'),
      hole: el('hole_v'),
      clearance: el('clearance_v'),
      thick: el('thick_v'),
      wire: el('wire_v')
    };

    const view = el('view');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 1200);
    camera.position.set(0, 52, 78);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
    view.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1, 0);
    controls.minDistance = 18;
    controls.maxDistance = 200;

    scene.add(new THREE.AmbientLight(0xffffff, 0.82));
    const key = new THREE.DirectionalLight(0xffffff, 1.08);
    key.position.set(24, 32, 20);
    scene.add(key);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(240, 128),
      new THREE.MeshStandardMaterial({ color: 0x11151f, roughness: 0.95, metalness: 0.02 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    scene.add(ground);

    const coverMat = new THREE.MeshStandardMaterial({ color: 0xe3e7ef, roughness: 0.45, metalness: 0.05 });
    const accentMat = new THREE.MeshStandardMaterial({ color: 0xffce47, roughness: 0.35, metalness: 0.06 });

    let coverGroup = new THREE.Group();
    scene.add(coverGroup);

    function getParams() {
      return {
        style: inputs.style.value,
        hole: parseFloat(inputs.hole.value),
        clearance: parseFloat(inputs.clearance.value),
        thickness: parseFloat(inputs.thick.value),
        centerHole: inputs.centerHole.value === 'on',
        wire: parseFloat(inputs.wire.value)
      };
    }

    function clearGroup(g) {
      while (g.children.length) {
        const c = g.children.pop();
        c.geometry?.dispose?.();
      }
    }

    function makeCoverShape(outerR, centerHole, centerR) {
      const shape = new THREE.Shape();
      shape.absarc(0, 0, outerR, 0, Math.PI * 2, false);
      if (centerHole) {
        const h = new THREE.Path();
        h.absarc(0, 0, centerR, 0, Math.PI * 2, true);
        shape.holes.push(h);
      }
      return shape;
    }

    function buildBase(p) {
      const group = new THREE.Group();
      const coverD = p.hole + 2 * p.clearance;
      const outerR = coverD / 2;

      const shape = makeCoverShape(outerR, p.centerHole, p.wire / 2);
      const plateGeo = new THREE.ExtrudeGeometry(shape, { depth: p.thickness, steps: 1, bevelEnabled: false, curveSegments: 128 });
      plateGeo.rotateX(-Math.PI / 2);
      // keep cover seated on ground plane (top at ~thickness)
      plateGeo.translate(0, 0, 0);
      group.add(new THREE.Mesh(plateGeo, coverMat));

      return { group, coverD };
    }

    function addFunCosmicMonster(group, p, coverD) {
      const z = p.thickness - 0.02;
      const faceD = coverD * 0.66;
      const ringOuter = faceD * 0.50;
      const ringInner = faceD * 0.40;
      const ringH = 0.9;

      // jagged portal ring
      const ringShape = new THREE.Shape();
      ringShape.absarc(0, 0, ringOuter, 0, Math.PI * 2, false);
      const ringHole = new THREE.Path();
      ringHole.absarc(0, 0, ringInner, 0, Math.PI * 2, true);
      ringShape.holes.push(ringHole);
      const ringGeo = new THREE.ExtrudeGeometry(ringShape, { depth: ringH, steps: 1, bevelEnabled: false, curveSegments: 120 });
      ringGeo.rotateX(-Math.PI / 2);
      ringGeo.translate(0, ringH + z, 0);
      group.add(new THREE.Mesh(ringGeo, accentMat));

      const spikeLen = faceD * 0.11;
      const spikeW = faceD * 0.11;
      const spikeShape = new THREE.Shape();
      spikeShape.moveTo(0, 0);
      spikeShape.lineTo(spikeLen, spikeW * 0.5);
      spikeShape.lineTo(spikeLen, -spikeW * 0.5);
      spikeShape.lineTo(0, 0);
      const spikeGeo2D = new THREE.ExtrudeGeometry(spikeShape, { depth: ringH, steps: 1, bevelEnabled: false, curveSegments: 8 });
      spikeGeo2D.rotateX(-Math.PI / 2);
      for (let a = 0; a < 360; a += 30) {
        const g = spikeGeo2D.clone();
        const m = new THREE.Matrix4();
        m.makeRotationY(THREE.MathUtils.degToRad(a));
        g.applyMatrix4(m);
        const x = Math.cos(THREE.MathUtils.degToRad(a)) * ringOuter * 0.92;
        const zPos = Math.sin(THREE.MathUtils.degToRad(a)) * ringOuter * 0.92;
        g.translate(x, ringH + z, zPos);
        group.add(new THREE.Mesh(g, accentMat));
      }

      // central eye + side eyes + pupil
      const eyeGeo = new THREE.CylinderGeometry(faceD * 0.12, faceD * 0.12, ringH, 80);
      const eye = new THREE.Mesh(eyeGeo, accentMat);
      eye.position.set(0, z + ringH / 2, faceD * 0.05);
      group.add(eye);

      const sideEyeGeo = new THREE.CylinderGeometry(faceD * 0.055, faceD * 0.055, ringH, 60);
      const eyeL = new THREE.Mesh(sideEyeGeo, accentMat);
      eyeL.position.set(-faceD * 0.19, z + ringH / 2, faceD * 0.09);
      const eyeR = new THREE.Mesh(sideEyeGeo.clone(), accentMat);
      eyeR.position.set(faceD * 0.19, z + ringH / 2, faceD * 0.09);
      group.add(eyeL, eyeR);

      const pupilGeo = new THREE.CylinderGeometry(faceD * 0.05, faceD * 0.05, ringH * 0.90, 60);
      const pupil = new THREE.Mesh(pupilGeo, coverMat);
      pupil.position.set(0, z + ringH * 0.57, faceD * 0.05);
      group.add(pupil);

      // fangs
      const fangShape = new THREE.Shape();
      fangShape.moveTo(0, 0);
      fangShape.lineTo(faceD * 0.05, 0);
      fangShape.lineTo(faceD * 0.025, -faceD * 0.10);
      fangShape.lineTo(0, 0);
      const fangGeo = new THREE.ExtrudeGeometry(fangShape, { depth: ringH, steps: 1, bevelEnabled: false, curveSegments: 6 });
      fangGeo.rotateX(-Math.PI / 2);
      const fangL = new THREE.Mesh(fangGeo.clone(), accentMat);
      fangL.position.set(-faceD * 0.11, z + ringH, -faceD * 0.17);
      const fangR = new THREE.Mesh(fangGeo.clone(), accentMat);
      fangR.position.set(faceD * 0.06, z + ringH, -faceD * 0.17);
      group.add(fangL, fangR);

      // mirrored tentacles (tube curves)
      const tPts = [];
      for (let i = 0; i <= 7; i += 1) {
        tPts.push(new THREE.Vector3(
          faceD * (0.06 + i * 0.06),
          z + ringH * 0.52,
          -faceD * (0.10 + i * 0.025) + faceD * 0.04 * Math.sin(THREE.MathUtils.degToRad(i * 40))
        ));
      }
      const tubeR = faceD * 0.042;
      const curveR = new THREE.CatmullRomCurve3(tPts);
      const geoR = new THREE.TubeGeometry(curveR, 72, tubeR, 18, false);
      group.add(new THREE.Mesh(geoR, accentMat));

      const tPtsL = tPts.map((v) => new THREE.Vector3(-v.x, v.y, v.z));
      const curveL = new THREE.CatmullRomCurve3(tPtsL);
      const geoL = new THREE.TubeGeometry(curveL, 72, tubeR, 18, false);
      group.add(new THREE.Mesh(geoL, accentMat));
    }

    function addKrakenAbyss(group, p, coverD) {
      const z = p.thickness - 0.02;
      const faceD = coverD * 0.72;
      const ringOuter = faceD * 0.475;
      const ringInner = faceD * 0.37;
      const ringH = 0.95;

      // broken abyss ring
      const baseRing = new THREE.Shape();
      baseRing.absarc(0, 0, ringOuter, 0, Math.PI * 2, false);
      const baseHole = new THREE.Path();
      baseHole.absarc(0, 0, ringInner, 0, Math.PI * 2, true);
      baseRing.holes.push(baseHole);
      const ringGeo = new THREE.ExtrudeGeometry(baseRing, { depth: ringH, steps: 1, bevelEnabled: false, curveSegments: 120 });
      ringGeo.rotateX(-Math.PI / 2);
      ringGeo.translate(0, ringH + z, 0);
      group.add(new THREE.Mesh(ringGeo, accentMat));

      const biteGeo = new THREE.BoxGeometry(faceD * 0.32, ringH, faceD * 0.22);
      const bite1 = new THREE.Mesh(biteGeo, coverMat);
      bite1.position.set(faceD * 0.39, z + ringH * 0.52, faceD * 0.12);
      bite1.rotation.y = THREE.MathUtils.degToRad(18);
      const bite2 = new THREE.Mesh(new THREE.BoxGeometry(faceD * 0.28, ringH, faceD * 0.18), coverMat);
      bite2.position.set(-faceD * 0.37, z + ringH * 0.52, -faceD * 0.08);
      bite2.rotation.y = THREE.MathUtils.degToRad(-16);
      group.add(bite1, bite2);

      // eyes + slits
      const eyeMain = new THREE.Mesh(new THREE.CylinderGeometry(faceD * 0.08, faceD * 0.08, ringH, 70), accentMat);
      eyeMain.position.set(-faceD * 0.13, z + ringH / 2, faceD * 0.08);
      const eyeMain2 = new THREE.Mesh(new THREE.CylinderGeometry(faceD * 0.08, faceD * 0.08, ringH, 70), accentMat);
      eyeMain2.position.set(faceD * 0.13, z + ringH / 2, faceD * 0.08);
      group.add(eyeMain, eyeMain2);

      const slitGeo = new THREE.BoxGeometry(faceD * 0.02, ringH * 0.9, faceD * 0.10);
      const slit1 = new THREE.Mesh(slitGeo, coverMat);
      slit1.position.copy(eyeMain.position);
      const slit2 = new THREE.Mesh(slitGeo, coverMat);
      slit2.position.copy(eyeMain2.position);
      group.add(slit1, slit2);

      // horns
      const hornShape = new THREE.Shape();
      hornShape.moveTo(0, 0);
      hornShape.lineTo(faceD * 0.07, faceD * 0.05);
      hornShape.lineTo(faceD * 0.02, faceD * 0.14);
      hornShape.lineTo(0, 0);
      const hornGeo = new THREE.ExtrudeGeometry(hornShape, { depth: ringH, steps: 1, bevelEnabled: false, curveSegments: 8 });
      hornGeo.rotateX(-Math.PI / 2);
      const hornL = new THREE.Mesh(hornGeo.clone(), accentMat);
      hornL.position.set(-faceD * 0.18, z + ringH, faceD * 0.26);
      const hornR = new THREE.Mesh(hornGeo.clone(), accentMat);
      hornR.position.set(faceD * 0.11, z + ringH, faceD * 0.28);
      group.add(hornL, hornR);

      // tentacles (asymmetric)
      const makeTentacle = (points) => {
        const c = new THREE.CatmullRomCurve3(points);
        const g = new THREE.TubeGeometry(c, 72, faceD * 0.04, 18, false);
        group.add(new THREE.Mesh(g, accentMat));
      };
      const ptsA = [];
      const ptsB = [];
      for (let i = 0; i <= 8; i += 1) {
        ptsA.push(new THREE.Vector3(faceD * (0.03 + i * 0.06), z + ringH * 0.53, -faceD * (0.03 + i * 0.03) + faceD * 0.05 * Math.sin(THREE.MathUtils.degToRad(i * 38))));
      }
      for (let i = 0; i <= 7; i += 1) {
        ptsB.push(new THREE.Vector3(-faceD * (0.02 + i * 0.055), z + ringH * 0.50, -faceD * (0.02 + i * 0.028) + faceD * 0.06 * Math.sin(THREE.MathUtils.degToRad(i * 46 + 25))));
      }
      makeTentacle(ptsA);
      makeTentacle(ptsB);

      // maw ring
      const maw = new THREE.Shape();
      maw.absarc(0, 0, faceD * 0.12, 0, Math.PI * 2, false);
      const mawHole = new THREE.Path();
      mawHole.absarc(0, 0, faceD * 0.07, 0, Math.PI * 2, true);
      maw.holes.push(mawHole);
      const mawGeo = new THREE.ExtrudeGeometry(maw, { depth: ringH, steps: 1, bevelEnabled: false, curveSegments: 64 });
      mawGeo.rotateX(-Math.PI / 2);
      mawGeo.translate(0, ringH + z, -faceD * 0.08);
      group.add(new THREE.Mesh(mawGeo, accentMat));
    }

    function rebuild() {
      const p = getParams();
      labels.style.textContent = p.style;
      labels.hole.textContent = p.hole.toFixed(0);
      labels.clearance.textContent = p.clearance.toFixed(1);
      labels.thick.textContent = p.thickness.toFixed(1);
      labels.wire.textContent = p.wire.toFixed(0);

      clearGroup(coverGroup);
      const { group, coverD } = buildBase(p);
      coverGroup.add(...group.children);

      if (p.style === 'kraken') {
        accentMat.color.set(0x8f5bff);
        addKrakenAbyss(coverGroup, p, coverD);
      } else if (p.style === 'fun') {
        accentMat.color.set(0xffce47);
        addFunCosmicMonster(coverGroup, p, coverD);
      }
    }

    function resize() {
      const w = view.clientWidth;
      const h = view.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    function setSimplePreset() {
      inputs.style.value = 'simple';
      inputs.centerHole.value = 'off';
      inputs.hole.value = '68';
      inputs.clearance.value = '2';
      inputs.thick.value = '2.4';
      rebuild();
    }

    function setFunPreset() {
      inputs.style.value = 'fun';
      inputs.centerHole.value = 'off';
      inputs.hole.value = '68';
      inputs.clearance.value = '2.5';
      inputs.thick.value = '2.6';
      rebuild();
    }

    function setKrakenPreset() {
      inputs.style.value = 'kraken';
      inputs.centerHole.value = 'off';
      inputs.hole.value = '68';
      inputs.clearance.value = '3.0';
      inputs.thick.value = '2.8';
      rebuild();
    }

    el('presetSimple').addEventListener('click', setSimplePreset);
    el('presetFun').addEventListener('click', setFunPreset);
    el('presetKraken').addEventListener('click', setKrakenPreset);
    el('reset').addEventListener('click', () => {
      inputs.style.value = 'simple';
      inputs.hole.value = '68';
      inputs.clearance.value = '2';
      inputs.thick.value = '2.4';
      inputs.centerHole.value = 'off';
      inputs.wire.value = '12';
      rebuild();
    });

    Object.values(inputs).forEach((n) => {
      n.addEventListener('input', rebuild);
      n.addEventListener('change', rebuild);
    });
    window.addEventListener('resize', resize);

    rebuild();
    resize();
    animate();
    window.__appReady = true;
  </script>
</body>
</html>
